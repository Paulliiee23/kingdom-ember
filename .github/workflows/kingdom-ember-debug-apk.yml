name: Kingdom Ember Android Debug APK
on:
  push:
    branches:
      - feature/royal-ui-v095
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build web application
        run: npm run build
      - name: Ensure Android project exists
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Synchronize Capacitor
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Kingdom-Ember-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
