name: Android Alpha APK
on:
  workflow_dispatch:
  push:
    branches: [feature/royal-ui-v095]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-alpha.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          npm install --include=dev --no-audit --no-fund
          npm install --no-save --include=dev @capacitor/cli@7.4.0 @capacitor/android@7.4.0 @capacitor/core@7.4.0
          test -x node_modules/.bin/cap
      - name: Build game
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android assets
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -x "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Validate APK signature and compatibility
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          echo "Using Android build tools: $BT"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:)"
          unzip -t "$APK" | tail -1
          sha256sum "$APK"
      - name: Upload APK diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kingdom-Ember-Build-Diagnostics
          path: android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Kingdom-Ember-Android-Alpha-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
