name: Kingdom Ember Android Test APK

on:
  push:
    branches:
      - feature/royal-ui-v095
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Generate and commit static castle GLB
        run: |
          python -m pip install --disable-pip-version-check numpy trimesh
          python scripts/build_royal_castle.py
          if ! git ls-files --error-unmatch public/models/Royal_Castle_v095.glb >/dev/null 2>&1 || ! git diff --quiet -- public/models/Royal_Castle_v095.glb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/models/Royal_Castle_v095.glb
            git commit -m "Add packaged Royal Castle GLB model"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and refresh outdated lockfile
        run: npm install --no-audit --no-fund

      - name: Build web game
        run: npm run build

      - name: Create Android wrapper
        run: npx cap add android

      - name: Sync game into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Kingdom-Ember-v0.9.5-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
